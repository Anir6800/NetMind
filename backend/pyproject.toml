[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netmind-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["alembic>=1.14,<2", "fastapi>=0.115,<1", "firebase-admin>=7,<8", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2,<3", "sqlalchemy>=2.0,<3"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
