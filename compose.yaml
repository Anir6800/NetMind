services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: netmind
      POSTGRES_USER: netmind_admin
      POSTGRES_PASSWORD: netmind_admin_local
    volumes:
      - netmind-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netmind_admin -d netmind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  netmind-postgres:
