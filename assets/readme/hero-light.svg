<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc"><title id="title">NetMind simulated network behaviour lab</title><desc id="desc">Animated packets travel through a small network; one link fails and recovers.</desc><style>@media (prefers-reduced-motion: reduce){animate,animateMotion{display:none}}.packet{filter:drop-shadow(0 0 5px #25d9c8)}text{font-family:Arial,sans-serif}</style><rect width="960" height="280" rx="24" fill="#edf8f7"/><g fill="none" stroke="#8bb5b5" stroke-width="5" stroke-linecap="round"><path d="M160 160H350"/><path d="M350 160H540"><animate attributeName="stroke" values="#8bb5b5;#ef4444;#ef4444;#8bb5b5" dur="6s" repeatCount="indefinite"/></path><path d="M540 160H750"/><path d="M350 160L540 225" stroke-dasharray="10 10"/></g><g fill="#ffffff" stroke="#25a99b" stroke-width="3"><rect x="100" y="120" width="120" height="80" rx="16"/><rect x="290" y="120" width="120" height="80" rx="16"/><rect x="480" y="120" width="120" height="80" rx="16"/><rect x="690" y="120" width="120" height="80" rx="16"/></g><g fill="#12353a" font-size="15" font-weight="700" text-anchor="middle"><text x="160" y="165">HOST</text><text x="350" y="165">ROUTER A</text><text x="540" y="165">ROUTER B</text><text x="750" y="165">HOST</text></g><g class="packet" fill="#25d9c8"><circle r="8"><animateMotion dur="3s" repeatCount="indefinite" path="M160 160H750"/></circle><circle r="7" fill="#8b5cf6"><animateMotion begin="1.5s" dur="3s" repeatCount="indefinite" path="M750 160H160"/></circle></g><text x="56" y="58" fill="#0f2c31" font-size="32" font-weight="700">NetMind</text><text x="56" y="88" fill="#477277" font-size="17">Build it. Break it. Watch a simulated network adapt.</text><g font-size="14" font-weight="700"><text x="395" y="116" fill="#ef4444"><animate attributeName="opacity" values="0;0;1;1;0" dur="6s" repeatCount="indefinite"/>LINK DOWN</text><text x="395" y="246" fill="#25a99b">OSPF BACKUP PATH</text></g></svg>