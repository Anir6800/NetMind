<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title"><title id="title">NetMind local architecture</title><style>@media (prefers-reduced-motion: reduce){animateMotion{display:none}}text{font-family:Arial,sans-serif}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#25a99b"/></marker></defs><rect width="960" height="260" rx="22" fill="#071b24"/><g fill="#10313c" stroke="#25a99b" stroke-width="2"><rect x="42" y="92" width="160" height="76" rx="14"/><rect x="288" y="92" width="160" height="76" rx="14"/><rect x="534" y="92" width="160" height="76" rx="14"/><rect x="780" y="92" width="140" height="76" rx="14"/></g><g fill="#d8f5f1" font-size="16" font-weight="700" text-anchor="middle"><text x="122" y="124">React canvas</text><text x="122" y="148">SIMULATED engine</text><text x="368" y="124">FastAPI</text><text x="368" y="148">validation</text><text x="614" y="124">PostgreSQL</text><text x="614" y="148">saved labs</text><text x="850" y="124">Optional AI</text><text x="850" y="148">JSON only</text></g><g fill="none" stroke="#25a99b" stroke-width="3" marker-end="url(#a)"><path id="p1" d="M205 130H282"/><path id="p2" d="M451 130H528"/><path id="p3" d="M697 130H774"/></g><g fill="#f6c453"><circle r="6"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle r="6"><animateMotion begin=".7s" dur="2.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><circle r="6"><animateMotion begin="1.4s" dur="2.4s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle></g><text x="42" y="48" fill="#d8f5f1" font-size="25" font-weight="700">Local-first learning stack</text><text x="42" y="216" fill="#93bab9" font-size="15">The browser runs the model. The server validates/saves labs and validates optional AI JSON.</text></svg>